name: AgentSec CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/agentsec.py \
            scripts/architecture_inventory.py \
            scripts/security_intel.py

      - name: Shell syntax
        run: |
          bash -n agentsec
          bash -n install-deps.sh
          bash -n scripts/local_server_audit.sh

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke tests
        run: |
          python scripts/agentsec.py --help
          python scripts/architecture_inventory.py . --output /tmp/agentsec-architecture.json
          python scripts/security_intel.py . --offline --skip-clamav --force
          python - <<'PY'
          import json
          with open('/tmp/agentsec-architecture.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['tool'] == 'AgentSec architecture inventory'
          assert 'signals' in data
          assert 'opportunities' in data
          with open('.agentsec/intel/metadata.json', encoding='utf-8') as f:
              intel = json.load(f)
          assert intel['tool'] == 'AgentSec security intelligence'
          print('Architecture and security-intel smoke tests passed')
          PY

      - name: Validate Agent Skills specification
        run: |
          python -m pip install --upgrade pip
          python -m pip install skills-ref
          rm -rf /tmp/agentsec
          mkdir -p /tmp/agentsec
          cp SKILL.md /tmp/agentsec/
          cp -r scripts references /tmp/agentsec/
          agentskills validate /tmp/agentsec
