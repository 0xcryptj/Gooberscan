name: AgentSec security report

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Generate AgentSec SARIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run AgentSec repository audit
        run: python scripts/agentsec.py repo .

      - name: Locate audit artifacts
        id: report
        shell: bash
        run: |
          report_dir="$(find .agentsec/reports -mindepth 1 -maxdepth 1 -type d -print | sort | tail -n 1)"
          test -n "$report_dir"
          test -f "$report_dir/findings.sarif"
          echo "dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Upload AgentSec report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentsec-report
          path: ${{ steps.report.outputs.dir }}
          if-no-files-found: error

      # GitHub does not grant write security-events permission to fork PRs.
      # The report artifact remains available for those pull requests.
      - name: Upload AgentSec SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: ${{ steps.report.outputs.dir }}/findings.sarif
