name: Remove final temporary image branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-final-image-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in hero-lossless-import readme-hero-fix; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" || true
          done
