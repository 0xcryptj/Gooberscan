name: Clean temporary image branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-temp-image-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary image branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for branch in hero-exact-upload hero-readme-image; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" || true
          done
