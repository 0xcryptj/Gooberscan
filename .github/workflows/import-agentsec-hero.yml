name: Install AgentSec README artwork

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  install-artwork:
    if: github.head_ref == 'fix-inline-hero'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify artwork
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .hero-avif-parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" = "8"
          mkdir -p assets
          cat .hero-avif-parts/part-*.b64 | tr -d '\n\r' | base64 --decode > assets/agentsec-hero.avif
          test "$(stat -c%s assets/agentsec-hero.avif)" = "82884"
          echo "da0d3c2fcd866f706eb9ca81ea4b74897dbebb3f7fa471b616dfeffa0000ea6f  assets/agentsec-hero.avif" | sha256sum -c -
          file assets/agentsec-hero.avif

      - name: Put artwork at top of README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          prefixes = [
              '<p align="center">\n  <img src="assets/agentsec-hero.png" alt="AgentSec - Spy on threats. Secure everything." width="100%" />\n</p>\n\n',
              '<p align="center">\n  <img src="assets/agentsec-hero.webp" alt="AgentSec - Spy on threats. Secure everything." width="100%" />\n</p>\n\n',
              '![AgentSec - Spy on threats. Secure everything.](assets/agentsec-hero.png)\n\n',
              '![AgentSec - Spy on threats. Secure everything.](assets/agentsec-hero.webp)\n\n',
              '![AgentSec - Spy on threats. Secure everything.](assets/agentsec-hero.avif)\n\n',
              '![AgentSec - Spy on threats. Secure everything.](https://raw.githubusercontent.com/0xcryptj/AgentSec/main/assets/agentsec-hero.webp)\n\n',
              '![AgentSec - Spy on threats. Secure everything.](https://raw.githubusercontent.com/0xcryptj/AgentSec/main/assets/agentsec-hero.avif)\n\n',
          ]
          for old in prefixes:
              text = text.replace(old, '')
          hero = '![AgentSec - Spy on threats. Secure everything.](https://raw.githubusercontent.com/0xcryptj/AgentSec/main/assets/agentsec-hero.avif)\n\n'
          p.write_text(hero + text.lstrip())

      - name: Commit finished image and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hero-parts .hero-avif-parts
          rm -f .hero-import-ready .run-hero-fix
          rm -f assets/agentsec-hero.png assets/agentsec-hero.webp
          rm -f .github/workflows/import-agentsec-hero.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Install AgentSec README artwork"
          git push origin HEAD:${{ github.head_ref }}
