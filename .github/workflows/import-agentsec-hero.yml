name: Import AgentSec hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-agentsec-hero.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify hero
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .hero-parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" = "20"
          mkdir -p assets
          cat .hero-parts/part-*.b64 | base64 --decode > assets/agentsec-hero.webp
          test "$(stat -c%s assets/agentsec-hero.webp)" = "114160"
          echo "089b485f0e80ebeb1fb16cf246ee75fa2d745a0c6e62769b44b87998e1e9c0cb  assets/agentsec-hero.webp" | sha256sum -c -
          file assets/agentsec-hero.webp
          sed -i 's#assets/agentsec-hero\.png#assets/agentsec-hero.webp#g' README.md
          rm -rf .hero-parts
          rm -f .github/workflows/import-agentsec-hero.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add AgentSec hero artwork"
          git push
