name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-repo-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository About description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method PATCH "repos/$GH_REPO" \
            -f description='AI-powered security audits and fixes for your code, apps, and servers.'

      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            agent-skill-v1 \
            dev \
            hero-artwork-upload \
            hero-blob-verify \
            hero-exact-final \
            hero-exact-fix \
            hero-exact-upload-test
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" || true
          done
