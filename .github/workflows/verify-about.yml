name: Verify repository About

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-about.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read repository description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO" --jq '.description // ""' > .github/about-result.txt
          cat .github/about-result.txt
      - name: Commit verification result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/about-result.txt
          git commit -m "Record repository description verification" || exit 0
          git push
