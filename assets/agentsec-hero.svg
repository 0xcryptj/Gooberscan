<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentSec</title>
  <desc id="desc">Black, white and red security operations hero with two rival spy agents, security dashboards and AgentSec branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030405"/>
      <stop offset="0.55" stop-color="#101214"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b2f"/>
      <stop offset="1" stop-color="#9d120b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#4e100d" stroke-width="1" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <path d="M0 550 C340 500 530 610 810 555 S1320 490 1600 535 V620 H0Z" fill="#0a0b0d"/>

  <!-- Brand -->
  <text x="800" y="90" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="3" fill="#f5f5f3">AGENT <tspan fill="#e52a1d">SEC</tspan></text>
  <text x="800" y="128" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="1.6" fill="#d7d8d9">SPY ON THREATS. <tspan fill="#ef3022">SECURE EVERYTHING.</tspan></text>

  <!-- Left briefing boards -->
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(55 165)">
      <rect width="280" height="118" rx="4" fill="#e7e5df" stroke="#6d6d69" stroke-width="3"/>
      <text x="18" y="35" font-size="24" font-weight="900" fill="#151515">⌕ RECON</text>
      <line x1="15" y1="46" x2="260" y2="46" stroke="#555"/>
      <text x="22" y="72" font-size="17" font-weight="700" fill="#242424">• MAP SURFACE</text>
      <text x="22" y="94" font-size="17" font-weight="700" fill="#242424">• ENUMERATE</text>
      <text x="155" y="94" font-size="17" font-weight="700" fill="#242424">• FIND EXPOSURES</text>
    </g>
    <g transform="translate(55 305)">
      <rect width="280" height="126" rx="4" fill="#deddd7" stroke="#6d6d69" stroke-width="3"/>
      <text x="18" y="35" font-size="24" font-weight="900" fill="#151515">◈ ANALYZE</text>
      <line x1="15" y1="46" x2="260" y2="46" stroke="#555"/>
      <text x="22" y="72" font-size="16" font-weight="700" fill="#242424">• VULNERABILITIES</text>
      <text x="22" y="94" font-size="16" font-weight="700" fill="#242424">• MISCONFIGURATIONS</text>
      <text x="22" y="116" font-size="16" font-weight="700" fill="#242424">• EXPOSED ASSETS</text>
    </g>
    <g transform="translate(55 450)">
      <rect width="280" height="105" rx="4" fill="#e5e2dc" stroke="#6d6d69" stroke-width="3"/>
      <text x="18" y="35" font-size="23" font-weight="900" fill="#151515">🛠 REMEDIATE</text>
      <line x1="15" y1="46" x2="260" y2="46" stroke="#555"/>
      <text x="22" y="73" font-size="17" font-weight="700" fill="#242424">• FIX  • HARDEN  • VERIFY</text>
    </g>
  </g>

  <!-- White spy -->
  <g transform="translate(335 180)">
    <path d="M60 115 Q175 45 300 112 L280 133 Q175 104 77 137Z" fill="#f3f1ec" stroke="#161719" stroke-width="5"/>
    <path d="M112 108 Q120 20 194 19 Q260 28 268 110Z" fill="#f5f2ed" stroke="#161719" stroke-width="6"/>
    <path d="M135 113 Q132 187 172 220 L254 173 Q246 126 224 111Z" fill="#f5f3ee" stroke="#161719" stroke-width="5"/>
    <path d="M169 144 Q218 137 259 154 L213 188 Q188 182 169 170Z" fill="#17191b"/>
    <ellipse cx="190" cy="153" rx="14" ry="18" fill="#111"/><circle cx="195" cy="149" r="5" fill="#fff"/>
    <path d="M160 173 L259 161 L198 211 L171 207Z" fill="#f4f2ed" stroke="#17191b" stroke-width="4"/>
    <path d="M126 217 Q84 250 65 382 L294 382 Q280 248 237 211 L194 250Z" fill="#efede8" stroke="#17191b" stroke-width="6"/>
    <path d="M129 255 L87 370 M233 254 L271 369" stroke="#777" stroke-width="3"/>
    <path d="M78 312 L164 286 L197 382 L74 382Z" fill="#ddd9d1" stroke="#17191b" stroke-width="4"/>
    <path d="M110 323 L178 301" stroke="#17191b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Black spy -->
  <g transform="translate(650 178)">
    <path d="M48 118 Q178 42 320 110 L300 135 Q185 104 66 139Z" fill="#0a0b0d" stroke="#c9c9c5" stroke-width="3"/>
    <path d="M112 109 Q122 19 200 18 Q276 27 286 111Z" fill="#090a0b" stroke="#b8b8b5" stroke-width="3"/>
    <path d="M145 114 Q139 185 183 220 L273 170 Q264 127 239 112Z" fill="#111315" stroke="#c9c9c5" stroke-width="3"/>
    <ellipse cx="199" cy="153" rx="14" ry="18" fill="#f7f6f2"/><circle cx="204" cy="149" r="5" fill="#090a0b"/>
    <path d="M171 174 L280 159 L212 213 L181 207Z" fill="#f0eee9" stroke="#111315" stroke-width="4"/>
    <path d="M132 219 Q82 260 69 384 L315 384 Q296 249 250 213 L202 252Z" fill="#090a0b" stroke="#bababa" stroke-width="3"/>
    <path d="M71 337 L181 290 L215 384 L69 384Z" fill="#131518" stroke="#5c5d60" stroke-width="4"/>
    <path d="M110 337 L193 304" stroke="#e22a1d" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Center shield -->
  <g transform="translate(744 466)" filter="url(#glow)">
    <path d="M56 0 L112 22 V75 Q112 123 56 149 Q0 123 0 75 V22Z" fill="#3c0d0a" stroke="#f03b2e" stroke-width="4"/>
    <rect x="40" y="62" width="32" height="34" rx="4" fill="#ef3428"/>
    <path d="M47 62 V52 Q47 41 56 41 Q65 41 65 52 V62" fill="none" stroke="#ef3428" stroke-width="7"/>
  </g>

  <!-- Right diagnostics -->
  <g transform="translate(1065 167)" font-family="Arial,Helvetica,sans-serif">
    <rect width="465" height="112" rx="7" fill="#0c0f11" stroke="#6d2924" stroke-width="2"/>
    <text x="20" y="32" fill="#f13b2f" font-size="22" font-weight="800">⚠ MISCONFIGURATIONS</text>
    <text x="25" y="62" fill="#a9a9a7" font-size="16">• PUBLIC STORAGE    • DEBUG ENABLED</text>
    <text x="25" y="88" fill="#a9a9a7" font-size="16">• OPEN CORS         • WEAK DEFAULTS</text>

    <rect y="128" width="225" height="142" rx="7" fill="#0c0f11" stroke="#6d2924" stroke-width="2"/>
    <text x="18" y="158" fill="#f13b2f" font-size="20" font-weight="800">EXPOSED PORTS</text>
    <text x="24" y="191" fill="#c4c4c1" font-size="16">22    SSH</text>
    <text x="24" y="216" fill="#c4c4c1" font-size="16">5432  POSTGRES</text>
    <text x="24" y="241" fill="#c4c4c1" font-size="16">6379  REDIS</text>

    <rect x="240" y="128" width="225" height="142" rx="7" fill="#0c0f11" stroke="#6d2924" stroke-width="2"/>
    <text x="258" y="158" fill="#f13b2f" font-size="20" font-weight="800">WEAK AUTH</text>
    <text x="258" y="191" fill="#c4c4c1" font-size="16">• NO MFA</text>
    <text x="258" y="216" fill="#c4c4c1" font-size="16">• BROAD ROLES</text>
    <text x="258" y="241" fill="#c4c4c1" font-size="16">• WEAK POLICY</text>

    <rect y="286" width="465" height="126" rx="7" fill="#0c0f11" stroke="#6d2924" stroke-width="2"/>
    <text x="18" y="318" fill="#f13b2f" font-size="20" font-weight="800">VULNERABLE PACKAGES</text>
    <text x="24" y="352" fill="#c4c4c1" font-size="16">CRITICAL  12     HIGH  27     MEDIUM  54</text>
    <text x="24" y="383" fill="#8b8b89" font-size="15">DEPENDENCIES • SECRETS • CONFIG • ACCESS</text>
  </g>

  <!-- Footer line -->
  <line x1="350" y1="583" x2="1530" y2="583" stroke="#3c3f42"/>
  <text x="350" y="607" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2" fill="#8e9092">RECON  /  ANALYZE  /  HARDEN  /  VERIFY</text>
</svg>